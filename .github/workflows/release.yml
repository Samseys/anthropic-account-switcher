name: release

# Trigger from the Actions tab: "Run workflow" -> enter a version like v4.0.0.
# The workflow tags the commit and publishes the release itself, so there is no
# need to create a tag (or release) by hand in the GitHub UI.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v4.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need tags to detect a duplicate release

      - name: Validate version
        run: |
          version="${{ inputs.version }}"
          if ! echo "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$version' must look like vX.Y.Z (e.g. v4.0.0), optionally with a -prerelease suffix."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::Tag '$version' already exists; pick a new version."
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Test
        run: go test ./...

      - name: Cross-compile
        run: make dist VERSION="${{ inputs.version }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.version }}" dist/* --generate-notes --target "${GITHUB_SHA}"
