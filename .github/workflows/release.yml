name: release

# Trigger from the Actions tab: "Run workflow" -> enter a version like v4.0.0.
# The workflow tags the commit and publishes the release itself, so there is no
# need to create a tag (or release) by hand in the GitHub UI.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v4.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Test
        run: go test ./...

      - name: Cross-compile
        env:
          CGO_ENABLED: 0
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          mkdir -p dist
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${t%/*}"; arch="${t#*/}"
            out="claude-acc_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            echo "building $out$ext"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${out}${ext}" .
          done
          ( cd dist && sha256sum * > SHA256SUMS )

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.version }}" dist/* --generate-notes --target "${GITHUB_SHA}"
